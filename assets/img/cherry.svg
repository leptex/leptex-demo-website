<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="樱桃 Cherries">
  <title>樱桃 · Cherries</title>
  <defs>
    <filter id="cw" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="6" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="cb" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#CE4B3E"/>
      <stop offset="46%" stop-color="#A81F1A"/>
      <stop offset="100%" stop-color="#6C100C"/>
    </radialGradient>
  </defs>

  <g filter="url(#cw)">
    <!-- 梗 -->
    <g fill="none" stroke="#4A4030" stroke-linecap="round">
      <path d="M128 28c-2 16-10 34-26 52-14 16-20 30-20 44" stroke-width="4.6"/>
      <path d="M128 28c6 14 14 26 26 38 12 12 16 24 14 34" stroke-width="4.2"/>
      <path d="M128 28c-4-8-4-14-2-20" stroke-width="4"/>
    </g>

    <!-- 叶 -->
    <g stroke="#33453A" stroke-width="1.6" stroke-linejoin="round">
      <path d="M132 22c20-20 54-18 66-4-14 22-52 24-66 4Z" fill="#5F7A66" opacity=".92"/>
      <path d="M136 19c16-2 34 0 50 6" fill="none" stroke="#2C3B31" stroke-width="1.2"/>
    </g>

    <!-- 果 -->
    <circle cx="82" cy="168" r="38" fill="url(#cb)"/>
    <circle cx="166" cy="152" r="34" fill="url(#cb)"/>
    <!-- 蒂窝 -->
    <g fill="#5A0F0B" opacity=".55">
      <ellipse cx="82" cy="132" rx="7" ry="4"/>
      <ellipse cx="167" cy="120" rx="6" ry="3.6"/>
    </g>
    <!-- 高光 -->
    <g fill="#F0B5A6" opacity=".5">
      <ellipse cx="66" cy="150" rx="12" ry="8" transform="rotate(-34 66 150)"/>
      <ellipse cx="152" cy="136" rx="10" ry="6.5" transform="rotate(-34 152 136)"/>
    </g>
  </g>
</svg>
