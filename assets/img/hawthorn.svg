<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="山楂 Hawthorn">
  <title>山楂 · Hawthorn</title>
  <defs>
    <filter id="hw" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="hb" cx="36%" cy="30%" r="76%">
      <stop offset="0" stop-color="#D9695C"/>
      <stop offset="46%" stop-color="#B5342A"/>
      <stop offset="100%" stop-color="#85211B"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#728F76"/>
      <stop offset="100%" stop-color="#47604E"/>
    </linearGradient>
  </defs>

  <g filter="url(#hw)">
    <!-- 枝 -->
    <g fill="none" stroke="#3A372F" stroke-linecap="round">
      <path d="M30 24C58 44 80 66 96 94c12 21 18 38 21 56" stroke-width="5"/>
      <path d="M78 72c14 10 26 22 34 36" stroke-width="3"/>
      <path d="M104 112c16 4 32 12 44 24" stroke-width="2.6"/>
      <path d="M112 130c-10 12-16 26-18 42" stroke-width="2.4"/>
    </g>

    <!-- 叶 -->
    <g stroke="#33453A" stroke-width="1.6" stroke-linejoin="round">
      <g transform="translate(62 40) rotate(-14)">
        <path d="M0 0C16-24 44-32 62-22 52 2 26 22 0 14Z" fill="url(#hl)" opacity=".92"/>
        <path d="M2 6C18-4 38-12 58-19" fill="none" stroke="#2C3B31" stroke-width="1.2"/>
      </g>
      <g transform="translate(28 88) rotate(24) scale(.86)">
        <path d="M0 0C16-24 44-32 62-22 52 2 26 22 0 14Z" fill="url(#hl)" opacity=".86"/>
        <path d="M2 6C18-4 38-12 58-19" fill="none" stroke="#2C3B31" stroke-width="1.2"/>
      </g>
      <g transform="translate(120 62) rotate(-46) scale(.72)">
        <path d="M0 0C16-24 44-32 62-22 52 2 26 22 0 14Z" fill="url(#hl)" opacity=".78"/>
        <path d="M2 6C18-4 38-12 58-19" fill="none" stroke="#2C3B31" stroke-width="1.2"/>
      </g>
    </g>

    <!-- 果 -->
    <g>
      <circle cx="166" cy="116" r="17" fill="url(#hb)"/>
      <circle cx="198" cy="142" r="15" fill="url(#hb)" opacity=".9"/>
      <circle cx="120" cy="136" r="18" fill="url(#hb)"/>
      <circle cx="182" cy="176" r="17" fill="url(#hb)" opacity=".94"/>
      <circle cx="152" cy="158" r="21" fill="url(#hb)"/>
      <circle cx="106" cy="188" r="17" fill="url(#hb)" opacity=".92"/>
      <circle cx="144" cy="204" r="19" fill="url(#hb)"/>
    </g>

    <!-- 果点 · 白色皮孔 -->
    <g fill="#F6E7DF" opacity=".78">
      <circle cx="160" cy="110" r="1.5"/><circle cx="172" cy="120" r="1.3"/><circle cx="163" cy="124" r="1.2"/>
      <circle cx="114" cy="130" r="1.6"/><circle cx="127" cy="141" r="1.3"/><circle cx="118" cy="145" r="1.2"/>
      <circle cx="145" cy="150" r="1.7"/><circle cx="159" cy="163" r="1.5"/><circle cx="148" cy="168" r="1.3"/><circle cx="160" cy="148" r="1.2"/>
      <circle cx="138" cy="197" r="1.6"/><circle cx="151" cy="209" r="1.4"/><circle cx="140" cy="212" r="1.2"/>
      <circle cx="100" cy="182" r="1.4"/><circle cx="112" cy="193" r="1.2"/>
      <circle cx="176" cy="170" r="1.4"/><circle cx="188" cy="181" r="1.2"/>
      <circle cx="193" cy="137" r="1.3"/>
    </g>

    <!-- 萼 -->
    <g fill="none" stroke="#6E1D18" stroke-width="1.8" stroke-linecap="round" opacity=".85">
      <g transform="translate(152 178)">
        <path d="M0 0v6M-5-2l-4 5M5-2l4 5M-6 2l-6 2M6 2l6 2"/>
      </g>
      <g transform="translate(144 222) scale(.9)">
        <path d="M0 0v6M-5-2l-4 5M5-2l4 5"/>
      </g>
      <g transform="translate(120 153) scale(.85)">
        <path d="M0 0v6M-5-2l-4 5M5-2l4 5"/>
      </g>
    </g>
  </g>
</svg>
